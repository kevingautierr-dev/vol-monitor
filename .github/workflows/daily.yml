name: daily-vol-snapshot

on:
  schedule:
    # GitHub often starts scheduled runs late (15 min to 5 h observed in Oct-Nov 2026),
    # so the job fires several times and scripts/daily.py decides what to do:
    # option chains are snapshotted once per day, only while the US session is open
    # (09:45-16:00 New York); every run refreshes history, monitors and the dashboard.
    #   15:13 / 17:13 / 19:13 UTC = 10:13 / 12:13 / 14:13 New York in winter (+1 h in summer)
    #   22:13 UTC = after the close: picks up the day's final bars and the VSTOXX close
    - cron: "13 15 * * 1-5"
    - cron: "13 17 * * 1-5"
    - cron: "13 19 * * 1-5"
    - cron: "13 22 * * 1-5"
  workflow_dispatch:
    inputs:
      check_sources:
        description: "Also run the source availability check"
        type: boolean
        default: false
      force_options:
        description: "Snapshot option chains even outside the US session"
        type: boolean
        default: false

permissions:
  contents: write      # commit the new snapshot + dashboard

concurrency:
  group: daily-vol
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Tests
        run: pytest -q

      - name: Source check
        if: ${{ inputs.check_sources }}
        run: python scripts/check_sources.py

      - name: Daily run (history, option chains if session open, monitors, dashboard)
        run: python scripts/daily.py ${{ inputs.force_options && '--force-options' || '' }}

      - name: Commit data and dashboard
        run: |
          git config user.name  "vol-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet && echo "nothing to commit" && exit 0
          git commit -m "snapshot $(TZ=America/New_York date +%F)"
          # GitHub occasionally answers a push with a transient 500 ("remote rejected"):
          # retry with backoff, rebasing in case main moved in the meantime.
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push failed (attempt $i), retrying in $((i * 15))s"
            sleep $((i * 15))
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
          done
          echo "::error::git push failed after 5 attempts"
          exit 1
