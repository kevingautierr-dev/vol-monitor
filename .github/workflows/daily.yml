name: daily-vol-snapshot

on:
  schedule:
    # 19:20 UTC Mon-Fri = 15:20 New York in summer, 14:20 in winter:
    # inside the session, so option bid/ask are live (Yahoo often returns 0/0 quotes after the close).
    - cron: "20 19 * * 1-5"
  workflow_dispatch:
    inputs:
      check_sources:
        description: "Also run the source availability check"
        type: boolean
        default: false

permissions:
  contents: write      # commit the new snapshot + dashboard

concurrency:
  group: daily-vol
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Tests
        run: pytest -q

      - name: Source check
        if: ${{ inputs.check_sources }}
        run: python scripts/check_sources.py

      - name: Daily run (history, option chains, monitors, dashboard)
        run: |
          # Weekend (New York time): Yahoo quotes are stale 0/0, so skip option chains
          # and only refresh history + monitors + dashboard.
          if [ "$(TZ=America/New_York date +%u)" -ge 6 ]; then
            echo "Weekend in New York: running without option chains"
            python scripts/daily.py --no-options
          else
            python scripts/daily.py
          fi

      - name: Commit data and dashboard
        run: |
          git config user.name  "vol-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet && echo "nothing to commit" && exit 0
          git commit -m "snapshot $(TZ=America/New_York date +%F)"
          # GitHub occasionally answers a push with a transient 500 ("remote rejected"):
          # retry with backoff, rebasing in case main moved in the meantime.
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push failed (attempt $i), retrying in $((i * 15))s"
            sleep $((i * 15))
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
          done
          echo "::error::git push failed after 5 attempts"
          exit 1
